name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run offline unit tests
        run: npm test
      - name: Verify the package contents
        run: npm pack --dry-run

  skill:
    name: validate agent skill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md structure
        run: |
          python3 - <<'PY'
          import os, re, sys
          path = 'skills/free-web-ai-worker/SKILL.md'
          text = open(path, encoding='utf-8').read()
          if not text.startswith('---'):
              sys.exit('SKILL.md must start with YAML frontmatter')
          front = text.split('---', 2)[1]
          for field in ('name:', 'description:'):
              if field not in front:
                  sys.exit(f'SKILL.md frontmatter missing {field}')
          if len(front.split('description:', 1)[1].strip()) < 40:
              sys.exit('description looks too short to route on')
          print('SKILL.md structure OK')
          PY
